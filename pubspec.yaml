name: app_base
description: "A maintainable, modular, production-ready Flutter application base."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Architecture stack (pinned — see development.md §8)
  bloc: 8.1.4
  flutter_bloc: 8.1.6
  get_it: 7.7.0
  dartz: 0.10.1
  equatable: 2.0.5
  go_router: 14.2.7
  dio: 5.7.0
  flutter_secure_storage: 9.2.2
  connectivity_plus: 6.0.5
  flutter_screenutil: 5.9.3
  intl: 0.19.0
  path_provider: 2.1.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: 9.1.7
  mocktail: 1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
